<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周报</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f7f8fa;
    color: #111827;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    max-width: 880px;
    margin: 0 auto;
    padding: 40px 24px;
  }
  .post {
    padding-bottom: 28px;
    margin-bottom: 28px;
    border-bottom: 1px solid #e5e7eb;
  }
  .post:last-child {
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
  }
  .update-time {
    color: #9ca3af;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .image {
    margin-bottom: 16px;
  }
  .image img {
    max-width: 100%;
    height: auto;
    display: block;
  }
  .text p {
    font-size: 16px;
    margin: 0 0 16px 0;
  }
  .text p:last-child {
    margin-bottom: 0;
  }
</style>
</head>
<body>
  <div class="container" id="feed"></div>
<script>
(function () {
  var POSTS = [{"time":"2026-10-30 15:18","images":["assets/20261030-1518-1.jpg"],"text":["今年比较不容易。不过也在接受范围内。只是大A还是那个大A，没有什么改变。想在这个市场混，就得吃苦，耐劳。今天，也算是一个利空的集中宣泄点。但后市，也看不出有什么大的上行理由。"]},{"time":"2026-10-23 15:09","images":["assets/20261023-1509-1.png"],"text":["这周有点累，正在做新策略的尾声。不要着急。涨跌自然，涨跌都有超额。"]},{"time":"2026-10-16 15:16","images":["assets/20261016-1516-1.png"],"text":["经历了十余年最差的一个节日周期。行情真的是比我想象中还要差。无论是险资的交易手法，还是监管、公司与公募、游资的心照不宣，都不好负面评论，只能坚守自己的优势，用alpha对冲可能的beta下行。总体投资策略完善，进可攻退可守，我也实在没什么好说的。只能说长期坚持在遍历状态下拥有最大获利概率。最不济也能从容退出。一个连退出终局都考虑好了的投资模式只管放心去做。终不会像部分实业一样最终打个7折或者更低折扣退出就是了。"]},{"time":"2026-10-07 20:19","images":[],"text":["以后的发布新不覆盖旧，往下看可回顾从前。"]},{"time":"2026-09-30 15:46","images":["assets/20260930-1546-1.png"],"text":["大家节日快乐，这几个月做了很多评测，收益只会越来越硬，净值越来越高"]}];
  var feed = document.getElementById('feed');
  if (!POSTS || !POSTS.length) return;

  POSTS.forEach(function (post) {
    var sec = document.createElement('div');
    sec.className = 'post';

    var t = document.createElement('div');
    t.className = 'update-time';
    t.textContent = '更新时间：' + post.time;
    sec.appendChild(t);

    (post.images || []).forEach(function (src) {
      var wrap = document.createElement('div');
      wrap.className = 'image';
      var img = document.createElement('img');
      img.src = src;
      img.alt = '';
      img.loading = 'lazy';
      wrap.appendChild(img);
      sec.appendChild(wrap);
    });

    if (post.text && post.text.length) {
      var body = document.createElement('div');
      body.className = 'text';
      post.text.forEach(function (para) {
        var p = document.createElement('p');
        p.textContent = para;
        body.appendChild(p);
      });
      sec.appendChild(body);
    }

    feed.appendChild(sec);
  });
})();
</script>
</body>
</html>
