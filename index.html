<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周报</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f7f8fa;
    color: #111827;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    max-width: 880px;
    margin: 0 auto;
    padding: 40px 24px;
  }
  .post {
    padding-bottom: 28px;
    margin-bottom: 28px;
    border-bottom: 1px solid #e5e7eb;
  }
  .post:last-child {
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
  }
  .update-time {
    color: #9ca3af;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .image {
    margin-bottom: 16px;
  }
  .image img {
    max-width: 100%;
    height: auto;
    display: block;
  }
  .text p {
    font-size: 16px;
    margin: 0 0 16px 0;
  }
  .text p:last-child {
    margin-bottom: 0;
  }
</style>
</head>
<body>
  <div class="container" id="feed"></div>
<script>
(function () {
  var POSTS = [{"time":"2026-10-07 20:19","images":[],"text":["以后的发布新不覆盖旧，往下看可回顾从前。"]},{"time":"2026-09-30 15:46","images":["assets/20260930-1546-1.png"],"text":["大家节日快乐，这几个月做了很多评测，收益只会越来越硬，净值越来越高"]}];
  var feed = document.getElementById('feed');
  if (!POSTS || !POSTS.length) return;

  POSTS.forEach(function (post) {
    var sec = document.createElement('div');
    sec.className = 'post';

    var t = document.createElement('div');
    t.className = 'update-time';
    t.textContent = '更新时间：' + post.time;
    sec.appendChild(t);

    (post.images || []).forEach(function (src) {
      var wrap = document.createElement('div');
      wrap.className = 'image';
      var img = document.createElement('img');
      img.src = src;
      img.alt = '';
      img.loading = 'lazy';
      wrap.appendChild(img);
      sec.appendChild(wrap);
    });

    if (post.text && post.text.length) {
      var body = document.createElement('div');
      body.className = 'text';
      post.text.forEach(function (para) {
        var p = document.createElement('p');
        p.textContent = para;
        body.appendChild(p);
      });
      sec.appendChild(body);
    }

    feed.appendChild(sec);
  });
})();
</script>
</body>
</html>
