<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周报</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f7f8fa;
    color: #111827;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    max-width: 880px;
    margin: 0 auto;
    padding: 40px 24px;
  }
  .update-time {
    color: #9ca3af;
    font-size: 13px;
    margin-bottom: 24px;
  }
  .image {
    margin-bottom: 24px;
  }
  .image img {
    max-width: 100%;
    height: auto;
    display: block;
  }
  .text p {
    font-size: 16px;
    margin: 0 0 16px 0;
  }
  .text p:last-child {
    margin-bottom: 0;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="update-time">更新时间：2026年08月21日 15:22</div>
    <div class="image"><img src="assets/1.png" alt=""></div>
    <div class="text">
      <p>缩量调整的一周。</p>
      <p>中美成长略有拖累，价值有所回护。转债还在回调降估值之中。总体市场情绪冷却。后期需要关注的点：1日加息对全球套息资金的影响，2中访美，3美利率通道。好坏都是继续按规则交易，但宏观信息可以解释当时市场的好坏原因，促进心理稳健性。</p>
    </div>
  </div>
</body>
</html>
