    <div class="update-time">更新时间：2026年08月14日 15:12</div>
    <div class="image"><img src="assets/1.png" alt=""></div>
    <div class="text"><p>本周可转债转股溢价率显著下降。转股溢价率可以理解为链接转债与正股的弹簧。可转债的制度性优势是，转债与正股，正股像是通过弹簧吊在转债下面。当正股跌的时候，弹簧拉升，可转债总体跌得比正股少。反之当正股回升的时候，先回缩弹簧，转债本身涨幅会小于正股。这样的制度特性，使得转债天然波动就小于正股，非常有利于长期投资。股市大部分人都在做市场博弈，我更多是做制度性、结构性套利。其余小事不表。</p></div>
